<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Formen-Werkstatt – Lektion 3</title></head>
<body><script src="kit.js"></script><script src="l3.js"></script>
<script>
(async () => {
const {W, H, ctx} = K;
const IMG = await K.load({bg:'img/werkstatt.jpg', afra:'img/afra.png'});
const TOP = 392, CW = 210, CH = 140, END_X = 1150, TIME = 90;
const TILES = ['o', 's', 't', 'mus', 'tis', 'nt', 'unt'];
const BTN = TILES.map((e, i) => ({x: 18 + i * 178, y: 618, w: 166, h: 84, e}));
const PRON = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie'];
let state = 'title', crates, spawnT, speed, timeLeft, lives, score, done, combo, errs, t0, hint;
function richtig(c) { return c.v[2] === 'i' && c.p === 5 ? 'unt' : L3.END[c.p]; }
function spawn() {
  const v = L3.pick(L3.V), p = Math.random() * 6 | 0;
  crates.push({v, p, x: -70, st: null, shake: 0, out: 0});
}
function start() { crates = []; spawnT = 0; speed = 70; timeLeft = TIME; lives = 3; score = 0; done = 0; combo = 0; errs = []; hint = null;
  state = 'play'; K.clearFx(); K.musicOn = true; K.music(...K.MEL.froh, .15); spawn(); }
function active() { return crates.filter(c => !c.st).sort((a, b) => b.x - a.x)[0]; }
function tap(e) {
  const c = active(); if (!c || state !== 'play') return;
  const ok = richtig(c);
  if (e === ok) {
    c.st = 'ok'; done++; combo++; const pts = 10 + Math.min(combo - 1, 5) * 2; score += pts; K.sfx.coin();
    K.float(c.x + CW / 2, TOP - CH - 40, '+' + pts, '#2ecc71', 36);
    if (c.v[2] === 'a' && c.p === 0) hint = {t: 2.5, txt: c.v[1] + ' + o  →  ' + L3.form(c.v, 0) + '   (das -a fällt weg!)'};
    if (c.v[2] === 'i' && c.p === 5) hint = {t: 2.5, txt: c.v[1] + ' + u + nt  →  ' + L3.form(c.v, 5) + '   (Sprechvokal!)'};
  } else {
    c.st = 'bad'; c.shake = .4; combo = 0; errs.push(c); K.sfx.bonk();
    let why = PRON[c.p] + ' → -' + ok;
    if (e === 'nt' && ok === 'unt') why = 'i-Konjugation: sie → -u-nt (Sprechvokal)!';
    if (e === 'unt' && ok === 'nt') why = 'Den Sprechvokal -u- gibt es nur bei der i-Konjugation!';
    hint = {t: 2.8, txt: why, bad: true};
  }
}
K.onTap = (x, y) => {
  if (state === 'title') { start(); return; }
  if (state === 'end') { if (performance.now() - t0 > 1200) start(); return; }
  for (const b of BTN) if (K.hit(x, y, b)) return tap(b.e);
};
K.onKey = e => {
  if (state !== 'play') { if (['Space', 'Enter'].includes(e.code)) K.onTap(-1, -1); return; }
  const i = '1234567'.indexOf(e.key); if (i >= 0) tap(TILES[i]);
};
function crate(c, act) {
  const x = c.x + (c.shake > 0 ? Math.sin(c.shake * 60) * 6 : 0), y = TOP - CH - (c.st === 'ok' ? c.out * 260 : 0);
  ctx.save(); if (c.st === 'ok') ctx.globalAlpha = Math.max(0, 1 - c.out * 1.4);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 8, TOP - 6, CW - 16, 10);
  K.rr(x, y, CW, CH, 10); ctx.fillStyle = '#c98b4a'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = act ? '#ffd23f' : '#7a4a1e'; ctx.stroke();
  ctx.strokeStyle = 'rgba(90,50,20,.45)'; ctx.lineWidth = 3;
  for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x + 6, y + i * CH / 3); ctx.lineTo(x + CW - 6, y + i * CH / 3); ctx.stroke(); }
  // Etikett
  K.rr(x + 14, y + 12, CW - 28, 74, 10); ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#8b5a2b'; ctx.stroke();
  if (c.st) {
    const t = L3.teile(c.v, c.p), full = L3.form(c.v, c.p);
    const st = t[0] + t[1];
    ctx.font = `700 34px ${K.FONT}`; const fs = K.fit(full, CW - 40, 34); ctx.font = `700 ${fs}px ${K.FONT}`;
    const w1 = ctx.measureText(t[0]).width, w2 = ctx.measureText(t[1]).width, wt = ctx.measureText(full).width, x0 = x + CW / 2 - wt / 2;
    K.text(t[0], x0, y + 50, fs, '#1f4e8c', {align: 'left'});
    if (t[1]) K.text(t[1], x0 + w1, y + 50, fs, '#c2187a', {align: 'left'});
    K.text(t[2], x0 + w1 + w2, y + 50, fs, '#e8730c', {align: 'left'});
    if (c.st === 'bad') K.text('✗', x + CW - 20, y + 14, 36, '#d62839', {stroke: '#fff', sw: 6});
    else K.text('✓', x + CW - 20, y + 14, 36, '#1e9e57', {stroke: '#fff', sw: 6});
  } else K.text(c.v[1] + '-', x + CW / 2, y + 50, K.fit(c.v[1] + '-', CW - 40, 38), '#1f4e8c');
  // Personen-Schild
  K.rr(x + 30, y + 94, CW - 60, 36, 18); ctx.fillStyle = '#7d0f1c'; ctx.fill();
  K.text(PRON[c.p], x + CW / 2, y + 113, 24, '#ffd23f');
  ctx.restore();
  if (act) K.text('▼', x + CW / 2, y - 22 + Math.sin(performance.now() / 150) * 4, 30, '#ffd23f', {stroke: '#7d0f1c', sw: 6});
}
K.loop((dt, t) => {
  ctx.drawImage(IMG.bg, 0, 0, W, H);
  // Förderband auf der Werkbank
  ctx.fillStyle = 'rgba(60,40,20,.55)'; ctx.fillRect(0, TOP - 4, W, 18);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  for (let i = 0; i < 30; i++) ctx.fillRect(((i * 60 + (state === 'play' ? t * speed : 0)) % (W + 60)) - 60, TOP, 30, 6);
  K.drawH(IMG.afra, 1205, 600, 300, true);
  if (state === 'play') {
    timeLeft -= dt; spawnT += dt; speed = 70 + done * 3.2;
    const gap = Math.max(1.6, 3.4 - done * .06);
    if (!crates.some(c => !c.st)) spawnT = Math.max(spawnT, gap - .5);
    if (spawnT > gap && crates.filter(c => !c.st).length < 4) { spawnT = 0; spawn(); }
    for (const c of crates) {
      c.shake = Math.max(0, c.shake - dt);
      if (c.st === 'ok') c.out += dt * 1.6; else c.x += speed * dt * (c.st === 'bad' ? 1.8 : 1);
      if (!c.st && c.x + CW > END_X) { c.st = 'bad'; c.miss = true; lives--; combo = 0; errs.push(c); K.sfx.wrong(); K.float(END_X - 60, TOP - 200, 'Zu langsam!', '#ff4d6d', 34); }
    }
    crates = crates.filter(c => c.out < .8 && c.x < W + 20);
    if (lives <= 0 || timeLeft <= 0) { state = 'end'; t0 = performance.now(); K.musicOn = false; K.sfx.win(); K.best('l3WerkstattBest', score); }
    const a = active();
    crates.forEach(c => crate(c, c === a));
    // HUD
    K.pill(72, 12, 170, '⏱ ' + Math.max(0, Math.ceil(timeLeft)) + ' s');
    K.rr(255, 12, 160, 50, 25); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
    for (let i = 0; i < 3; i++) K.heart(290 + i * 45, 38, i < lives);
    K.pill(980, 12, 150, score + ' P');
    // Hinweis
    if (hint) { hint.t -= dt; if (hint.t <= 0) hint = null; else {
      const w = K.fit(hint.txt, 900, 30); K.rr(W / 2 - 470, 470, 940, 60, 30); ctx.fillStyle = hint.bad ? 'rgba(214,40,57,.92)' : 'rgba(30,158,87,.92)'; ctx.fill();
      K.text(hint.txt, W / 2, 501, w, '#fff'); } }
    K.text('Welche Endung braucht die Kiste mit dem ▼?', W / 2, 588, 24, '#fff', {stroke: '#3b2a1a', sw: 6});
    BTN.forEach(b => K.button(b, '-' + b.e, null, {size: 40, textCol: '#e8730c'}));
    if (!K.focused()) K.text('Klicke ins Spiel, um zu spielen!', W / 2, 440, 26, '#fff', {stroke: '#000', sw: 6});
  }
  K.drawFx(dt);
  if (state === 'title') {
    K.panel(960, 590);
    K.title('FORMEN-WERKSTATT', 130, 64);
    K.text('Afra hat Arbeit für dich: Auf der Werkbank kommen Kisten an.', W / 2, 210, 27, '#3b2a1a', {weight: 500});
    K.text('Auf jeder Kiste steht ein Stamm und eine Person.', W / 2, 250, 27, '#3b2a1a', {weight: 500});
    K.text('Tippe die passende Endung:   lauda-  +  wir  →  -mus', W / 2, 310, 30, '#1f4e8c');
    K.text('Achtung, Spezialfälle:  ich bei lauda-  ·  sie bei veni-', W / 2, 370, 26, '#7d0f1c');
    K.text('Kommt eine Kiste ohne Endung ans Ende, ist ein Herz weg.', W / 2, 420, 25, '#d62839');
    K.text(TIME + ' Sekunden · Rekord: ' + K.best('l3WerkstattBest') + ' Punkte', W / 2, 465, 25, '#6b4f2a', {weight: 500});
    K.blink('Tippe, um zu starten!', 560, 34);
  }
  if (state === 'end') {
    K.panel(960, 580);
    K.title(lives <= 0 ? 'FEIERABEND!' : 'ZEIT IST UM!', 140, 64);
    K.text(done + ' Formen richtig gebaut  ·  ' + score + ' Punkte', W / 2, 225, 32, '#1f4e8c');
    K.text('Rekord: ' + K.best('l3WerkstattBest') + ' Punkte', W / 2, 270, 26, '#6b4f2a', {weight: 500});
    if (errs.length) {
      K.text('Diese Formen übst du noch einmal:', W / 2, 335, 26, '#6b4f2a', {weight: 500});
      const e = errs.slice(-4).map(c => PRON[c.p] + ': ' + L3.form(c.v, c.p)).join('   ·   ');
      K.text(e, W / 2, 380, K.fit(e, 900, 28), '#d62839');
    } else K.text('Fehlerfrei – Afra ist begeistert!', W / 2, 360, 28, '#1e9e57');
    K.blink('Tippe für eine neue Runde!', 555, 32);
  }
});
window.__game = {start, tap, active, get state() { return state; }};
})();
</script>
</body></html>
