<script>
// Kleine Wörter aus Prima 1, Lektion 1–3 (Bedeutungen wie im Lernwortschatz)
// neu:true = Lektion 3 ab "quin?" (für die Klasse noch neu)
const WOERTER = [
  {l:"ubi?",  m:"ubi?",  d:"wo?", lek:1, esel:"Ubi? – Ibi! Wo? – Dort! Die beiden reimen sich und gehören zusammen."},
  {l:"non",   m:"nōn",   d:"nicht", lek:1, esel:"Non klingt wie „No!“ – nicht!"},
  {l:"et",    m:"et",    d:"und, auch", lek:1, esel:"Das Zeichen & ist ein verschnörkeltes „et“."},
  {l:"sed",   m:"sed",   d:"aber, sondern", lek:1, esel:"„Sed“ ist kurz wie ein Einwand: „Aber …!“"},
  {l:"nunc",  m:"nunc",  d:"jetzt, nun", lek:1, esel:"nunc – nun: gleicher Anfang, gleiche Bedeutung."},
  {l:"etiam", m:"etiam", d:"auch, sogar", lek:1, esel:"et + iam: „und schon“ ist noch einer dabei – auch, sogar."},
  {l:"undique", m:"undique", d:"von allen Seiten, von überallher", lek:1, esel:"UNDique: UND von hier UND von da UND von dort."},
  {l:"ibi",   m:"ibi",   d:"dort", lek:1, esel:"Ubi? – Ibi! Wo? – Dort!"},
  {l:"quis?", m:"quis?", d:"wer?", lek:1, esel:"Im Quiz fragt man: Wer weiß es? Quis?"},
  {l:"hic",   m:"hīc",   d:"hier", lek:1, esel:"hic – hier: beide beginnen mit h."},
  {l:"cur?",  m:"cūr?",  d:"warum?", lek:1, esel:"Warum fährt Oma zur Kur? Cur?"},
  {l:"diu",   m:"diū",   d:"lange, lange Zeit", lek:2, esel:"„Die U-Bahn“ (di-u) kommt lange nicht."},
  {l:"itaque", m:"itaque", d:"deshalb", lek:2, esel:"ita-que heißt wörtlich „und so“ – also: deshalb."},
  {l:"iterum", m:"iterum", d:"wieder(um), zum zweiten Mal", lek:2, esel:"„I, da ist er wieder rum!“ – iterum."},
  {l:"iam",   m:"iam",   d:"schon, bereits, nun", lek:2, esel:"„Ja, mmh – schon fertig!“ – iam."},
  {l:"subito", m:"subitō", d:"plötzlich", lek:2, esel:"Wie ein U-Boot (Sub), das plötzlich auftaucht."},
  {l:"non iam", m:"nōn iam", d:"nicht mehr", lek:2, esel:"non + iam: Achtung, nicht „nicht schon“, sondern „nicht mehr“!"},
  {l:"statim", m:"statim", d:"sofort, auf der Stelle", lek:2, esel:"Kommt von stare (stehen): auf der STelle."},
  {l:"bene",  m:"bene",  d:"gut", lek:2, esel:"Italienisch „bene“ – wie in „Va bene!“"},
  {l:"semper", m:"semper", d:"immer", lek:2, esel:"Spanisch „siempre“ – immer."},
  {l:"aliter", m:"aliter", d:"anders, sonst", lek:3, esel:"Ein Alien ist ein anderes Wesen – aliter."},
  {l:"recte", m:"rēctē", d:"richtig, zu Recht", lek:3, esel:"kor-REKT, englisch „right“ – recte."},
  {l:"certe", m:"certē", d:"gewiss, sicherlich", lek:3, esel:"Ein ZERTifikat macht etwas sicher – certe."},
  {l:"quin?", m:"quīn?", d:"warum nicht?", lek:3, neu:true, esel:"quiN? – das n steht für „nicht“: Warum nicht?"},
  {l:"quid?", m:"quid?", d:"was?", lek:3, neu:true, esel:"quis? fragt nach der Person (wer?), quiD? nach dem Ding (was?)."},
  {l:"autem", m:"autem", d:"aber, andererseits", lek:3, neu:true, esel:"„Au, aber das tut weh!“ – autem steht nie am Satzanfang."},
  {l:"paulo", m:"paulō", d:"(um) ein wenig", lek:3, neu:true, esel:"Paul ist nur ein wenig größer – paulo."},
  {l:"post",  m:"post",  d:"dann, später", lek:3, neu:true, esel:"Die Post kommt immer später."},
  {l:"paulo post", m:"paulō post", d:"wenig später, kurz darauf", lek:3, neu:true, esel:"paulo (ein wenig) + post (später) = wenig später."},
  {l:"tum",   m:"tum",   d:"da, dann, damals", lek:3, neu:true, esel:"tum – dann: kurz und knapp, beide mit Nasenlaut am Ende."},
  {l:"quemadmodum?", m:"quemadmodum?", d:"wie? auf welche Weise?", lek:3, neu:true, esel:"Darin steckt „modus“ = Art und Weise: Auf welche Weise?"}
];

const VERW={"subito":["statim"],"statim":["subito"],"iam":["non iam","nunc"],"non iam":["iam","non"],"itaque":["iterum","etiam"],"iterum":["itaque","semper"],
 "etiam":["iam","itaque"],"ibi":["hic","ubi?"],"hic":["ibi"],"ubi?":["ibi","cur?"],"certe":["recte"],"recte":["certe","bene"],"nunc":["iam","tum"],"cur?":["quis?","ubi?"],
 "quis?":["cur?","quid?"],"quid?":["quis?"],"quin?":["cur?"],"post":["paulo post","paulo"],"paulo post":["post","paulo"],"paulo":["paulo post","post"],"tum":["nunc","iam"],
 "autem":["itaque","etiam"],"quemadmodum?":["cur?","ubi?"],"sed":["et","itaque"],"et":["sed","non"],"diu":["semper","iterum"],"semper":["diu","iterum"],"bene":["recte","certe"],
 "aliter":["iterum","certe"],"undique":["ibi","hic"],"non":["non iam","et"]};
const KURZ={"undique":"von allen Seiten","iterum":"wieder","quemadmodum?":"wie?","iam":"schon","statim":"sofort","paulo post":"wenig später","tum":"da, dann","diu":"lange","certe":"gewiss","recte":"richtig","aliter":"anders"};
const kurz=w=>KURZ[w.l]||w.d;
const W=1280,H=720,BODEN=612,SX=230,RUNDE=20;
const cv=document.getElementById("cv"),c=cv.getContext("2d");
function passe(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+"px";cv.style.height=H*s+"px"}
addEventListener("resize",passe);passe();
let ton_an=true,ac=null;
function ton(f,d=.12,typ="square",v=.06){if(!ton_an)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=typ;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function misch(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let rekord=0;try{rekord=+localStorage.getItem("adv_jagd_rekord")||0}catch(e){}

let S={zustand:"menu"};
function neu(){
  const alt=misch(WOERTER.filter(w=>!w.neu)).slice(0,14), neuw=misch(WOERTER.filter(w=>w.neu)).slice(0,6);
  S={zustand:"spiel",liste:[...alt,...neuw],i:0,punkte:0,herzen:3,serie:0,richtig:0,fehler:[],y:0,vy:0,tor:null,t:0,off:0,pause:0,meld:null,schweb:[],tempo:1};
  naechstesTor();
}
function naechstesTor(){
  if(S.i>=S.liste.length||S.herzen<=0){return ende()}
  const w=S.liste[S.i];const kand=misch(VERW[w.l]||[]);let fw=WOERTER.find(x=>x.l===kand[0]);
  if(!fw||kurz(fw)===kurz(w))fw=misch(WOERTER.filter(x=>x.l!==w.l&&kurz(x)!==kurz(w)))[0];
  S.tor={w,oben:Math.random()<.5,falsch:kurz(fw),x:W+260,gewertet:false};
  S.tempo=1+Math.floor(S.richtig/6)*.18;
}
function ende(){S.zustand="ende";if(S.punkte>rekord){rekord=S.punkte;try{localStorage.setItem("adv_jagd_rekord",rekord)}catch(e){}}
  [523,659,784].forEach((f,k)=>setTimeout(()=>ton(f,.25,"triangle",.09),k*150))}
function sprung(){if(S.zustand==="spiel"&&S.y===0&&!S.pause){S.vy=1050;ton(520,.1)}}
function tipp(x,y){
  if(x<95&&y<95){location.href="index.html";return}
  if(x>W-90&&y<90){ton_an=!ton_an;return}
  if(x>W-180&&x<W-90&&y<90){try{(document.fullscreenElement?document.exitFullscreen():cv.requestFullscreen()).catch(()=>{})}catch(e){}return}
  if(S.zustand==="menu"||S.zustand==="ende"){neu();return}
  if(S.pause&&S.pause<1.2){return}
  if(S.pause){S.pause=0;S.meld=null;naechstesTor();return}
  sprung();
}
cv.addEventListener("pointerdown",e=>{if(e.pointerType==="touch")e.preventDefault();window.focus();cv.focus();const r=cv.getBoundingClientRect();tipp((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height)});
addEventListener("keydown",e=>{if(e.key===" "||e.key==="ArrowUp"||e.key==="Enter"){e.preventDefault();tipp(400,400)}});

function werte(){
  const t=S.tor,hoch=S.y>70,gewaehltOben=hoch,ok=gewaehltOben===t.oben;t.gewertet=true;t.ok=ok;S.i++;
  if(ok){S.serie++;S.richtig++;const p=10+Math.min(S.serie-1,5)*2;S.punkte+=p;S.schweb.push({x:SX,y:BODEN-200-S.y,t:0,txt:"+"+p+(S.serie>2?"  Serie ×"+S.serie:"")});ton(784,.1);setTimeout(()=>ton(1047,.15),90)}
  else{S.herzen--;S.serie=0;S.fehler.push(t.w);S.pause=.01;S.meld=t.w;ton(150,.35,"sawtooth",.08)}
}
function schritt(dt){
  if(S.zustand!=="spiel")return;
  S.t+=dt;
  S.schweb.forEach(s=>s.t+=dt);S.schweb=S.schweb.filter(s=>s.t<1.2);
  if(S.pause){S.pause+=dt;return}
  const v=330*S.tempo;S.off+=v*dt;
  S.vy-=2600*dt;S.y+=S.vy*dt;if(S.y<=0){S.y=0;S.vy=0}
  const t=S.tor;t.x-=v*dt;
  if(!t.gewertet&&t.x<=SX+30)werte();
  if(t.gewertet&&t.ok&&t.x<-200)naechstesTor();
}
// ---------- Zeichnen ----------
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function txt(s,x,y,gr,farbe,o={}){c.font=`${o.w||600} ${gr}px Fredoka,"Trebuchet MS",sans-serif`;c.textAlign=o.a||"center";c.textBaseline="middle";
  if(o.kontur){c.lineWidth=o.lw||8;c.strokeStyle=o.kontur;c.lineJoin="round";c.strokeText(s,x,y)}c.fillStyle=farbe;c.fillText(s,x,y)}
function passend(s,max,gr){c.font=`600 ${gr}px Fredoka,"Trebuchet MS",sans-serif`;while(c.measureText(s).width>max&&gr>18){gr-=2;c.font=`600 ${gr}px Fredoka,"Trebuchet MS",sans-serif`}return gr}
